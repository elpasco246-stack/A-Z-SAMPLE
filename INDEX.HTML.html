<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cyber A–Z Wheel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--bg:#f3f6f4;--ink:#12211b;--card:#fff;--line:#c9d6cf;--accent:#0b7a53;--bad:#b3261e;--used:#b9c4be;--muted:#4b5d54;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1814;--ink:#e6f1ec;--card:#16251f;--line:#2b4136;--accent:#4fd69c;--bad:#ff8a80;--used:#3a4a42;--muted:#9bb1a5}}
:root[data-theme="dark"]{--bg:#0e1814;--ink:#e6f1ec;--card:#16251f;--line:#2b4136;--accent:#4fd69c;--bad:#ff8a80;--used:#3a4a42;--muted:#9bb1a5}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;min-height:100%;padding:16px}
main{max-width:860px;margin:0 auto;display:grid;gap:20px}
h1{font-size:clamp(1.5rem,4vw,2.2rem);margin:0}
.sub{color:var(--muted);margin:4px 0 0}
.bar{display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:8px}
.score{font-weight:700;font-size:1.1rem}
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:700px){.stage{grid-template-columns:1fr}}
.wheelbox{position:relative;max-width:420px;width:100%;margin:0 auto}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:24px solid var(--ink);z-index:2}
#wheel{width:100%;display:block;transition:transform 4.2s cubic-bezier(.12,.6,.1,1)}
#wheel text{font-weight:700;font-size:15px;fill:#fff;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
#wheel path{stroke:var(--bg);stroke-width:1.5}
#wheel .used{fill:var(--used)!important}
.hub{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
button{font:inherit;cursor:pointer;border-radius:10px;border:2px solid var(--ink);background:var(--card);color:var(--ink);padding:10px 16px;font-weight:700}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}
#spin{pointer-events:auto;border-radius:50%;width:84px;height:84px;background:var(--accent);color:#fff;border-color:var(--bg);font-size:1.05rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-height:260px}
.big{font-size:3rem;font-weight:700;color:var(--accent);line-height:1;margin:0 0 8px}
.clue{font-size:1.15rem;margin:0 0 14px;max-width:60ch}
.opts{display:grid;gap:8px}
.opts button{text-align:left}
.opts button.right{background:var(--accent);color:#fff;border-color:var(--accent)}
.opts button.wrong{border-color:var(--bad);color:var(--bad)}
.fb{margin-top:12px;font-weight:700}
.fb.bad{color:var(--bad)}
.fb.good{color:var(--accent)}
@media (prefers-reduced-motion:reduce){#wheel{transition:none}}
</style>
</head>
<body>
<main>
  <div class="bar">
    <div>
      <h1>Cyber A–Z Wheel</h1>
      <p class="sub">Spin for a letter. Pick the cybersecurity term that matches the clue.</p>
    </div>
    <div class="score" aria-live="polite">Score: <span id="score">0</span> / <span id="done">0</span> answered</div>
  </div>
  <div class="stage">
    <div class="wheelbox">
      <div class="pointer"></div>
      <svg id="wheel" viewBox="0 0 300 300" role="img" aria-label="Wheel with letters A to Z"></svg>
      <div class="hub"><button id="spin">Spin</button></div>
    </div>
    <section class="panel" id="panel" aria-live="polite">
      <p class="clue">Press <b>Spin</b> to get your first letter. Each letter is used once, so 26 spins finish the game.</p>
    </section>
  </div>
  <div><button id="reset">Restart game</button></div>
</main>
<script>
const D=[
["A","Antivirus","Software that detects and removes malicious programs."],
["B","Botnet","A network of infected devices controlled remotely by an attacker."],
["C","Cookie","A small file a website stores in your browser to remember you."],
["D","DDoS","An attack that floods a website with traffic until it crashes."],
["E","Encryption","Scrambling data so only authorized people can read it."],
["F","Firewall","A system that monitors and controls incoming and outgoing network traffic."],
["G","Gray hat","A hacker who is neither fully ethical nor fully malicious."],
["H","Hacker","Someone who gains access to systems, for good or bad reasons."],
["I","Identity theft","Stealing someone’s personal information to pretend to be them."],
["J","Juice jacking","Stealing data through a public USB charging port."],
["K","Keylogger","A tool that records everything you type."],
["L","Logic bomb","Malicious code that stays hidden until a set condition is met."],
["M","Malware","Software made to harm or exploit a device."],
["N","Network segmentation","Splitting a network into parts to limit how far an attack can spread."],
["O","OTP","A one-time password that works for a single login."],
["P","Phishing","Fake messages that trick you into sharing personal information."],
["Q","Quishing","A scam that hides a malicious link behind a fake QR code."],
["R","Ransomware","Malware that locks your files until you pay."],
["S","Spyware","Software that secretly collects your information."],
["T","Two-factor authentication","A second step, like a code, that proves it’s really you."],
["U","URL spoofing","A fake web address that imitates a real site."],
["V","VPN","A service that sends your connection through an encrypted tunnel."],
["W","Worm","Malware that spreads from device to device by itself."],
["X","XSS","Injecting malicious scripts into a trusted web page."],
["Y","YubiKey","A physical security key used to verify your login."],
["Z","Zero-day","A flaw attackers exploit before the developer has patched it."]
];
const N=D.length,S=360/N;
const wheel=document.getElementById("wheel"),panel=document.getElementById("panel");
const spinBtn=document.getElementById("spin");
let used=new Set(),score=0,rot=0,busy=false,current=null;
function pt(a,r){const t=a*Math.PI/180;return [150+r*Math.sin(t),150-r*Math.cos(t)]}
let svg="";
D.forEach((d,i)=>{
  const [x0,y0]=pt((i-.5)*S,145),[x1,y1]=pt((i+.5)*S,145);
  svg+=`<path id="s${i}" d="M150,150 L${x0},${y0} A145,145 0 0 1 ${x1},${y1} Z" fill="hsl(${i*360/N},58%,38%)"/>`;
  svg+=`<text transform="rotate(${i*S} 150 150)" x="150" y="30">${d[0]}</text>`;
});
wheel.innerHTML=svg;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function updateScore(){document.getElementById("score").textContent=score;document.getElementById("done").textContent=used.size}
spinBtn.onclick=()=>{
  if(busy)return;
  const free=D.map((_,i)=>i).filter(i=>!used.has(i));
  if(!free.length)return;
  busy=true;spinBtn.disabled=true;
  current=free[Math.floor(Math.random()*free.length)];
  panel.innerHTML='<p class="clue">Spinning…</p>';
  const target=(360-current*S)%360;
  const delta=((target-(rot%360))+360)%360+360*5;
  rot+=delta;
  wheel.style.transform=`rotate(${rot}deg)`;
  setTimeout(ask,matchMedia("(prefers-reduced-motion:reduce)").matches?50:4300);
};
function ask(){
  const d=D[current];
  const others=shuffle(D.filter((_,i)=>i!==current)).slice(0,3).map(x=>x[1]);
  const opts=shuffle([d[1],...others]);
  panel.innerHTML=`<p class="big">${d[0]}</p><p class="clue">${d[2]}</p><div class="opts"></div><div id="fb"></div>`;
  const box=panel.querySelector(".opts");
  opts.forEach(o=>{
    const b=document.createElement("button");b.textContent=o;
    b.onclick=()=>answer(o,box);box.appendChild(b);
  });
}
function answer(o,box){
  const d=D[current],ok=o===d[1];
  box.querySelectorAll("button").forEach(b=>{
    b.disabled=true;
    if(b.textContent===d[1])b.classList.add("right");
    else if(b.textContent===o)b.classList.add("wrong");
  });
  if(ok)score++;
  used.add(current);
  document.getElementById("s"+current).classList.add("used");
  updateScore();
  const fb=document.getElementById("fb");
  const finished=used.size===N;
  fb.innerHTML=`<p class="fb ${ok?"good":"bad"}">${ok?"Correct! +1 point.":"Not quite. The answer is "+d[1]+"."}</p>`+
    (finished?`<p class="fb">Game over. Final score: ${score} / ${N}.</p>`:`<button id="next">Back to the wheel</button>`);
  if(!finished){document.getElementById("next").onclick=()=>{panel.innerHTML='<p class="clue">Press <b>Spin</b> for the next letter.</p>';busy=false;spinBtn.disabled=false;spinBtn.focus()}}
  else{busy=false}
}
document.getElementById("reset").onclick=()=>{
  used=new Set();score=0;busy=false;spinBtn.disabled=false;
  wheel.querySelectorAll(".used").forEach(p=>p.classList.remove("used"));
  panel.innerHTML='<p class="clue">Press <b>Spin</b> to get your first letter. Each letter is used once, so 26 spins finish the game.</p>';
  updateScore();
};
</script>
</body>
</html>
